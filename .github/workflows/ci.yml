name: CI & Docker Build Check

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linting & Syntax Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Check Python Syntax & Compilation
        run: |
          python -m py_compile src/main.py src/core/*.py src/tts/*.py src/stock/*.py src/subtitles/*.py src/composer/*.py src/publisher/*.py src/scheduler/*.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Smoke Check)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: niyoktri-shorts-factory:test
